[project]
name = "archiveboxes-workspace"
version = "0.0.0"
description = "Local uv monorepo environment for ArchiveBox packages"
requires-python = ">=3.13,<3.15"
dependencies = [
    "abxbus",
    "abxpkg",
    "abx-plugins",
    "abx-dl",
    "archivebox",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3,<9",
    "pytest-codeblocks>=0.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
abxbus = { workspace = true }
abxpkg = { workspace = true }
abx-plugins = { workspace = true }
abx-dl = { workspace = true }
archivebox = { workspace = true }

[tool.uv.workspace]
members = [
    "abxbus",
    "abxpkg",
    "abx-plugins",
    "abx-dl",
    "archivebox",
]

[tool.pytest.ini_options]
testpaths = ["README.md", "AGENTS.md", "skills"]
addopts = ["--codeblocks"]
