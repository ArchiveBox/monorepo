[packages.abxbus]
repository = "ArchiveBox/abxbus"
tag_prefix = ""
downstream_repository = "ArchiveBox/abxpkg"
downstream_branch = "main"
update_mode = "lock"

[packages.abxpkg]
repository = "ArchiveBox/abxpkg"
tag_prefix = "v"
downstream_repository = "ArchiveBox/abx-plugins"
downstream_branch = "main"
update_mode = "exact"

[packages.abx-plugins]
repository = "ArchiveBox/abx-plugins"
tag_prefix = "v"
downstream_repository = "ArchiveBox/abx-dl"
downstream_branch = "main"
update_mode = "exact"

[packages.abx-dl]
repository = "ArchiveBox/abx-dl"
tag_prefix = "v"
downstream_repository = "ArchiveBox/ArchiveBox"
downstream_branch = "main"
update_mode = "exact"

[packages.archivebox]
repository = "ArchiveBox/ArchiveBox"
tag_prefix = "v"
downstream_repository = ""
downstream_branch = ""
update_mode = ""
dispatch_repositories = ["ArchiveBox/homebrew-archivebox", "ArchiveBox/debian-archivebox", "ArchiveBox/ios-archivebox"]
dispatch_workflows = ["update-archivebox-dev.yml", "build.yml", "release.yml"]

[source_pins.archivebox-browser-extension]
repository = "ArchiveBox/archivebox-browser-extension"
downstream_repository = "ArchiveBox/ios-archivebox"
downstream_branch = "main"
pin_file = "scripts/prepare-safari.mjs"
