name: Set up Squid
description: Verify and configure the shared Squid proxy for a CI job.
inputs:
  proxy:
    description: HTTP URL of the Squid proxy.
    required: true
  ca:
    description: Public Squid CA certificate in PEM format.
    required: true
  tailscale-client-id:
    description: Tailscale federated identity for hosted runners.
    required: false
  tailscale-audience:
    description: Audience assigned to the federated identity.
    required: false
  browser:
    description: Configure Chrome proxy arguments and trust for this job.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Connect to Tailscale
      if: runner.environment == 'github-hosted' && inputs.tailscale-client-id != ''
      uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:squid-ci

    - name: Check Squid HTTPS access
      shell: bash
      env:
        SQUID_PROXY: ${{ inputs.proxy }}
        SQUID_CA: ${{ inputs.ca }}
      run: |
        set -euo pipefail
        if [[ -z "$SQUID_PROXY" || -z "$SQUID_CA" ]]; then
          echo "::error title=Squid configuration missing::Set the runner pool's Squid URL and public CA certificate."
          exit 1
        fi

        temp="$(mktemp -d "$RUNNER_TEMP/squid.XXXXXX")"
        printf '%s\n' "$SQUID_CA" >"$temp/ca.crt"
        # Use a separate URL so the check leaves the canary workload cold.
        if ! status="$(curl --disable --fail --silent --show-error --noproxy '' \
          --connect-timeout 3 --max-time 5 --proxy "$SQUID_PROXY" --cacert "$temp/ca.crt" \
          --output /dev/null --write-out '%{http_code}' https://www.example.com/)"; then
          echo "::error title=Squid unavailable::HTTPS through the configured proxy failed."
          exit 1
        fi
        if [[ "$status" != 200 ]]; then
          echo "::error title=Squid check failed::Expected HTTP 200 through Squid, got $status."
          exit 1
        fi
        echo 'Squid HTTPS check passed.'

        # Retain public trust because HTTPS hosts outside Squid's SSL Bump list use their origin certificates.
        system_ca="${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}"
        if [[ "$RUNNER_OS" == macOS && -z "${SSL_CERT_FILE:-}" ]]; then
          system_ca=/etc/ssl/cert.pem
        fi
        { cat "$system_ca"; printf '\n'; cat "$temp/ca.crt"; } >"$temp/ca-bundle.crt"
        wget_config="${WGETRC:-$HOME/.wgetrc}"
        {
          if [[ -f "$wget_config" ]]; then
            cat "$wget_config"
          fi
          printf '\nca_certificate = %s\n' "$temp/ca-bundle.crt"
        } >"$temp/wgetrc"
        # Keep runner services and uncached build transports off the NAS connection.
        # HTTPX accepts bare IPv6 addresses in NO_PROXY and rejects bracketed literals.
        direct="localhost,127.0.0.1,::1,.localhost,github.com,.github.com,githubusercontent.com,.githubusercontent.com,.actions.githubusercontent.com,.blob.core.windows.net,pypi.org,files.pythonhosted.org,registry.npmjs.org,registry.yarnpkg.com,nodejs.org,releases.astral.sh,proxy.golang.org,sum.golang.org"
        no_proxy="$direct${NO_PROXY:+,$NO_PROXY}${no_proxy:+,$no_proxy}"
        {
          printf 'HTTP_PROXY=%s\nHTTPS_PROXY=%s\nhttp_proxy=%s\nhttps_proxy=%s\n' \
            "$SQUID_PROXY" "$SQUID_PROXY" "$SQUID_PROXY" "$SQUID_PROXY"
          printf 'NO_PROXY=%s\nno_proxy=%s\n' "$no_proxy" "$no_proxy"
          printf 'SSL_CERT_FILE=%s\nCURL_CA_BUNDLE=%s\nREQUESTS_CA_BUNDLE=%s\n' \
            "$temp/ca-bundle.crt" "$temp/ca-bundle.crt" "$temp/ca-bundle.crt"
          printf 'WGETRC=%s\nNODE_EXTRA_CA_CERTS=%s\nNODE_USE_ENV_PROXY=1\nSQUID_CA_CERT=%s\n' \
            "$temp/wgetrc" "$temp/ca.crt" "$temp/ca.crt"
        } >> "$GITHUB_ENV"

    - name: Configure Chrome for Squid
      if: inputs.browser == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == Linux ]]; then
          if ! command -v certutil >/dev/null; then
            if ! apt-cache show libnss3-tools >/dev/null 2>&1; then
              sudo apt-get update
            fi
            sudo apt-get install -y --no-install-recommends libnss3-tools
          fi
          # Chrome 146+ also recognizes the legacy path, which older Chrome requires.
          nss_dir="$HOME/.pki/nssdb"
          if [[ ! -d "$nss_dir" && -d "$HOME/.local/share/pki/nssdb" ]]; then
            nss_dir="$HOME/.local/share/pki/nssdb"
          fi
          mkdir -p "$nss_dir"
          if [[ ! -f "$nss_dir/cert9.db" ]]; then
            certutil -N --empty-password -d "sql:$nss_dir"
          fi
          certutil -A -d "sql:$nss_dir" -n 'ugNAS Squid CA' -t 'C,,' -i "$SQUID_CA_CERT"
        elif [[ "$RUNNER_OS" == macOS ]]; then
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain "$SQUID_CA_CERT"
        else
          echo "::error title=Squid browser setup failed::Unsupported Chrome trust store on $RUNNER_OS."
          exit 1
        fi
        args="$(jq -c --arg proxy "--proxy-server=$HTTPS_PROXY" '. + [$proxy]' <<<"${CHROME_ARGS_EXTRA:-[]}")"
        printf 'CHROME_ARGS_EXTRA=%s\n' "$args" >> "$GITHUB_ENV"
