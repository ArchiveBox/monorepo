name: Shared proxy canary

on:
  workflow_dispatch:
    inputs:
      start_at:
        description: Unix time to begin requests across both runner pools
        required: false
        default: '0'
      proxy_port:
        description: Optional port for validating a replacement proxy
        required: false
        default: ''
      replay_only:
        description: Verify the replay-only listener without sending traffic upstream
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: squid-canary
  cancel-in-progress: false

jobs:
  requests:
    if: github.repository == 'ArchiveBox/monorepo' && github.ref == 'refs/heads/main'
    name: Shared proxy canary (${{ matrix.pool }})
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: GitHub-hosted
            labels: '["ubuntu-24.04"]'
            proxy_variable: SQUID_TAILNET_URL
          - pool: ugNAS
            labels: '["self-hosted","ugnas-linux"]'
            proxy_variable: SQUID_LAN_URL
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select proxy endpoint
        id: proxy
        shell: bash
        env:
          DEFAULT_PROXY: ${{ vars[matrix.proxy_variable] }}
          PROXY_PORT: ${{ inputs.proxy_port }}
          REPLAY_ONLY: ${{ inputs.replay_only }}
        run: |
          set -euo pipefail
          if [[ "$REPLAY_ONLY" == true && -z "$PROXY_PORT" ]]; then
            PROXY_PORT=3129
          fi
          if [[ -n "$PROXY_PORT" ]]; then
            [[ "$PROXY_PORT" =~ ^[0-9]{1,5}$ ]]
            DEFAULT_PROXY="${DEFAULT_PROXY%:*}:$PROXY_PORT"
          fi
          printf 'url=%s\n' "$DEFAULT_PROXY" >> "$GITHUB_OUTPUT"

      - name: Set up shared proxy
        uses: ./.github/actions/setup-squid
        with:
          proxy: ${{ steps.proxy.outputs.url }}
          ca: ${{ vars.SQUID_CA }}
          tailscale-client-id: ${{ vars.SQUID_TAILSCALE_CLIENT_ID }}
          tailscale-audience: ${{ vars.SQUID_TAILSCALE_AUDIENCE }}

      - name: Verify proxy certificates and egress
        shell: bash
        run: |
          set -euo pipefail
          timeout 5 openssl s_client -proxy "${HTTPS_PROXY#http://}" \
            -connect example.com:443 -servername example.com \
            -verify_hostname example.com -verify_return_error -x509_strict \
            -CAfile "$SQUID_CA_CERT" -brief </dev/null

          status="$(curl --disable --silent --show-error --noproxy '' \
            --proxy "$HTTP_PROXY" --max-time 5 --output /dev/null --write-out '%{http_code}' \
            http://169.254.169.254/)"
          if [[ "$status" != 403 ]]; then
            echo "::error title=Squid egress check failed::Expected HTTP 403 for a link-local destination, got $status."
            exit 1
          fi

      - name: Verify replay-only HTTPS and HTTP
        if: inputs.replay_only
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d "$RUNNER_TEMP/proxy-replay.XXXXXX")"
          fetch=(curl --disable --silent --show-error --noproxy '' --proxy "$HTTPS_PROXY" \
            --cacert "$SQUID_CA_CERT" --max-time 5)
          "${fetch[@]}" --fail https://example.com/ | grep -q 'Example Domain'
          for scheme in http https; do
            url="$scheme://httpbingo.org/post?replay-canary=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            status="$("${fetch[@]}" --data 'body=cache-miss' --dump-header "$temp/$scheme.headers" \
              --output "$temp/$scheme.body" --write-out '%{http_code}' "$url")"
            [[ "$status" == 502 ]]
            grep -iq '^x-ci-cache: REPLAY-MISS' "$temp/$scheme.headers"
          done

      - name: Verify the isolated test network
        if: inputs.replay_only && runner.environment == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          export CANARY_PATH="$PATH"
          node .github/ci-proxy/run-isolated.mjs bash -ec '
            test "$PATH" = "$CANARY_PATH"
            test ! -S /run/docker.sock
            test -z "$(ip -4 route show default)"
            test -z "$(ip -6 route show default)"
            if curl --disable --silent --noproxy "*" --connect-timeout 2 https://1.1.1.1/ -o /dev/null; then
              exit 1
            fi
            curl --disable --fail --silent --show-error --max-time 5 https://example.com/ | grep -q "Example Domain"
          '

      - name: Request live URLs through the proxy
        if: '!inputs.replay_only'
        shell: bash
        env:
          START_AT: ${{ inputs.start_at }}
        run: |
          set -euo pipefail
          temp="$(mktemp -d "$RUNNER_TEMP/squid-canary.XXXXXX")"
          [[ "$START_AT" =~ ^[0-9]+$ ]]
          now="$(date +%s)"
          if (( START_AT > now )); then
            delay=$(( START_AT - now ))
            (( delay <= 180 ))
            sleep "$delay"
          fi

          # A fresh URL tests a cold cache on every run without flushing other projects' cache entries.
          page="https://example.com/?archivebox-ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          crx="https://clients2.google.com/service/update2/crx?response=redirect&prodversion=1230&acceptformat=crx3&x=id%3Dmpiodijhokgodhhofbcjdecpffjipkle%26uc"

          fetch() {
            curl --fail --silent --show-error --location --noproxy '' \
              --connect-timeout 10 --max-time 30 --proxy "$HTTPS_PROXY" --cacert "$SQUID_CA_CERT" \
              --output "$temp/$1" "$2"
          }
          printf 'Requests started at %s UTC\n' "$(date -u +%FT%T)"
          pids=()
          for n in 1 2 3 4; do
            fetch "page-$n" "$page" &
            pids+=("$!")
          done
          for n in 1 2; do
            fetch "crx-$n" "$crx" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          grep -q 'Example Domain' "$temp/page-1"
          for n in 2 3 4; do
            cmp "$temp/page-1" "$temp/page-$n"
          done
          [[ "$(od -An -N4 -tx1 "$temp/crx-1" | tr -d '[:space:]')" == 43723234 ]]
          cmp "$temp/crx-1" "$temp/crx-2"
          (cd "$temp" && sha256sum page-1 crx-1)

      - name: Verify POST replay and cache isolation
        if: '!inputs.replay_only'
        shell: bash
        env:
          POOL: ${{ matrix.pool }}
        run: |
          set -euo pipefail
          temp="$(mktemp -d "$RUNNER_TEMP/proxy-post.XXXXXX")"
          url="https://httpbingo.org/post?ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$POOL"

          fetch() {
            curl --disable --fail --silent --show-error --noproxy '' \
              --connect-timeout 5 --max-time 25 --proxy "$HTTPS_PROXY" --cacert "$SQUID_CA_CERT" \
              --header "Cookie: ci-replay=$3" --data-urlencode "body=$2" \
              --dump-header "$temp/$1.headers" --output "$temp/$1.json" "$url"
            jq -e --arg body "$2" '.form.body == [$body]' "$temp/$1.json" >/dev/null
          }

          # Fan out without prewarming to verify that concurrent misses share one upstream request.
          pids=()
          for n in {1..20}; do
            fetch "repeat-$n" one original &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          test "$(grep -ilm1 '^x-ci-cache: MISS' "$temp"/repeat-*.headers | wc -l)" -eq 1
          test "$(grep -ilm1 '^x-ci-cache: HIT' "$temp"/repeat-*.headers | wc -l)" -eq 19

          fetch changed-body two original
          fetch changed-cookie one other
          fetch repeat-cookie one other
          grep -iq '^x-ci-cache: MISS' "$temp/changed-body.headers"
          grep -iq '^x-ci-cache: MISS' "$temp/changed-cookie.headers"
          grep -iq '^x-ci-cache: HIT' "$temp/repeat-cookie.headers"
          cmp "$temp/changed-cookie.json" "$temp/repeat-cookie.json"
