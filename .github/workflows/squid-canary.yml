name: Squid canary

on:
  workflow_dispatch:
    inputs:
      start_at:
        description: Unix time to begin requests across both runner pools
        required: false
        default: '0'

permissions:
  contents: read
  id-token: write

concurrency:
  group: squid-canary
  cancel-in-progress: false

jobs:
  requests:
    if: github.repository == 'ArchiveBox/monorepo' && github.ref == 'refs/heads/main'
    name: Squid canary (${{ matrix.pool }})
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: GitHub-hosted
            labels: '["ubuntu-24.04"]'
            proxy_variable: SQUID_TAILNET_URL
          - pool: ugNAS
            labels: '["self-hosted","ugnas-linux"]'
            proxy_variable: SQUID_LAN_URL
    steps:
      - name: Connect to Tailscale
        if: runner.environment == 'github-hosted'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.SQUID_TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.SQUID_TAILSCALE_AUDIENCE }}
          tags: tag:squid-ci

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Squid
        uses: ./.github/actions/setup-squid
        with:
          proxy: ${{ vars[matrix.proxy_variable] }}
          ca: ${{ vars.SQUID_CA }}

      - name: Request live URLs through Squid
        shell: bash
        env:
          START_AT: ${{ inputs.start_at }}
        run: |
          set -euo pipefail
          temp="$(mktemp -d "$RUNNER_TEMP/squid-canary.XXXXXX")"
          [[ "$START_AT" =~ ^[0-9]+$ ]]
          now="$(date +%s)"
          if (( START_AT > now )); then
            delay=$(( START_AT - now ))
            (( delay <= 180 ))
            sleep "$delay"
          fi

          # A fresh URL tests a cold cache on every run without flushing other projects' cache entries.
          page="https://example.com/?archivebox-ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          crx="https://clients2.google.com/service/update2/crx?response=redirect&prodversion=1230&acceptformat=crx3&x=id%3Dmpiodijhokgodhhofbcjdecpffjipkle%26uc"

          fetch() {
            curl --fail --silent --show-error --location --noproxy '' \
              --connect-timeout 10 --max-time 30 --proxy "$HTTPS_PROXY" --cacert "$SQUID_CA_CERT" \
              --output "$temp/$1" "$2"
          }
          printf 'Requests started at %s UTC\n' "$(date -u +%FT%T)"
          pids=()
          for n in 1 2 3 4; do
            fetch "page-$n" "$page" &
            pids+=("$!")
          done
          for n in 1 2; do
            fetch "crx-$n" "$crx" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done

          grep -q 'Example Domain' "$temp/page-1"
          for n in 2 3 4; do
            cmp "$temp/page-1" "$temp/page-$n"
          done
          [[ "$(od -An -N4 -tx1 "$temp/crx-1" | tr -d '[:space:]')" == 43723234 ]]
          cmp "$temp/crx-1" "$temp/crx-2"
          (cd "$temp" && sha256sum page-1 crx-1)
