name: Cascade verified release

on:
  workflow_call:
    inputs:
      upstream_package:
        description: Released Python distribution name
        required: true
        type: string
      upstream_version:
        description: Exact public release version
        required: true
        type: string
    secrets:
      release_token:
        description: Token allowed to push the immediate dependent repository
        required: true

permissions:
  contents: read

concurrency:
  group: cascade-${{ inputs.upstream_package }}
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchiveBox/monorepo
          ref: main
          path: coordinator
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Resolve dependency edge
        id: edge
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          uv run --no-cache --no-project python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          package_name = os.environ["UPSTREAM_PACKAGE"]
          version = os.environ["UPSTREAM_VERSION"]
          graph = tomllib.loads(Path("coordinator/.github/release-graph.toml").read_text())["packages"]
          if package_name not in graph:
              raise SystemExit(f"Unknown release package: {package_name}")
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:rc\d+)?", version):
              raise SystemExit(f"Unsupported release version: {version}")
          edge = graph[package_name]
          if edge["repository"].lower() != os.environ["GITHUB_REPOSITORY"].lower():
              raise SystemExit(
                  f"{package_name} releases must originate from {edge['repository']}, "
                  f"not {os.environ['GITHUB_REPOSITORY']}"
              )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as stream:
              for key, value in edge.items():
                  if isinstance(value, list):
                      value = ",".join(value)
                  print(f"{key}={value}", file=stream)
          PY

      - name: Checkout exact released dependency set
        if: steps.edge.outputs.downstream_repository != '' || steps.edge.outputs.dispatch_repositories != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.edge.outputs.repository }}
          ref: ${{ format('{0}{1}', steps.edge.outputs.tag_prefix, inputs.upstream_version) }}
          path: upstream
          persist-credentials: false

      - name: Checkout immediate dependent
        if: steps.edge.outputs.downstream_repository != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.edge.outputs.downstream_repository }}
          ref: ${{ steps.edge.outputs.downstream_branch }}
          path: downstream
          fetch-depth: 0
          token: ${{ secrets.release_token }}

      - name: Check whether release is already consumed
        if: steps.edge.outputs.downstream_repository != ''
        id: state
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        working-directory: downstream
        run: |
          set -Eeuo pipefail
          STATE="$(uv run --no-cache --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_name = os.environ["UPSTREAM_PACKAGE"]
          released_version = os.environ["UPSTREAM_VERSION"]
          graph = tomllib.loads(Path("../coordinator/.github/release-graph.toml").read_text())["packages"]
          package_order = list(graph)
          released_index = package_order.index(package_name)
          released_lock = {
              package["name"]: package["version"]
              for package in tomllib.loads(Path("../upstream/uv.lock").read_text())["package"]
          }
          downstream_lock = {
              package["name"]: package["version"]
              for package in tomllib.loads(Path("uv.lock").read_text())["package"]
          }
          if released_lock.get(package_name) != released_version:
              raise SystemExit(
                  f"Release tag lock has {package_name}=={released_lock.get(package_name)}, "
                  f"not {released_version}"
              )
          required_names = package_order[: released_index + 1]
          missing = [name for name in required_names if name not in released_lock]
          if missing:
              raise SystemExit(f"Release tag lock is missing internal packages: {', '.join(missing)}")
          required = {name: released_lock[name] for name in required_names}

          if all(downstream_lock.get(name) == version for name, version in required.items()):
              print("consumed")
          else:
              print("needed")
          PY
          )"
          if [[ "$STATE" == "consumed" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${UPSTREAM_PACKAGE} ${UPSTREAM_VERSION} is already consumed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release tools through abxpkg
        if: steps.state.outputs.needed == 'true' || steps.edge.outputs.dispatch_repositories != ''
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/abx-lib
        working-directory: ${{ steps.edge.outputs.downstream_repository != '' && 'downstream' || 'coordinator' }}
        run: |
          set -Eeuo pipefail
          ABXPKG_VERSION="$(uv run --no-cache --no-project python - <<'PY'
          import tomllib
          from pathlib import Path

          packages = tomllib.loads(Path("uv.lock").read_text())["package"]
          print(next(package["version"] for package in packages if package["name"] == "abxpkg"))
          PY
          )"
          uv run --no-cache --no-project --with "abxpkg==$ABXPKG_VERSION" abxpkg env \
            --install \
            --no-cache \
            --json \
            --lib="$ABXPKG_LIB_DIR" \
            --binproviders=env,apt \
            git gh >/dev/null
          for name in git gh; do
            binary="$ABXPKG_LIB_DIR/env/bin/$name"
            test -L "$binary"
            test -x "$binary"
          done
          {
            echo "GIT_BINARY=$ABXPKG_LIB_DIR/env/bin/git"
            echo "GH_BINARY=$ABXPKG_LIB_DIR/env/bin/gh"
          } >> "$GITHUB_ENV"

      - name: Verify exact public upstream release
        if: steps.state.outputs.needed == 'true' || steps.edge.outputs.dispatch_repositories != ''
        env:
          GH_TOKEN: ${{ secrets.release_token }}
          UPSTREAM_REPOSITORY: ${{ steps.edge.outputs.repository }}
          UPSTREAM_TAG_PREFIX: ${{ steps.edge.outputs.tag_prefix }}
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        working-directory: ${{ steps.edge.outputs.downstream_repository != '' && 'downstream' || 'coordinator' }}
        run: |
          set -Eeuo pipefail
          uv run --no-cache --no-project python -c 'import time; time.sleep(60)'
          RELEASE_TAG="$("$GH_BINARY" release view "${UPSTREAM_TAG_PREFIX}${UPSTREAM_VERSION}" \
            --repo "$UPSTREAM_REPOSITORY" \
            --json tagName \
            --jq .tagName)"
          test "$RELEASE_TAG" = "${UPSTREAM_TAG_PREFIX}${UPSTREAM_VERSION}"
          WHEEL_URL="$(uv run --no-cache --no-project python - "$UPSTREAM_PACKAGE" "$UPSTREAM_VERSION" <<'PY'
          import json
          import sys
          import urllib.request

          package, version = sys.argv[1:]
          with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/{version}/json", timeout=20) as response:
              release = json.load(response)
          if release["info"]["version"] != version:
              raise SystemExit(f"PyPI returned {release['info']['version']}, not {version}")
          wheels = [artifact["url"] for artifact in release["urls"] if artifact["packagetype"] == "bdist_wheel"]
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly one public wheel for {package}=={version}, found {len(wheels)}")
          print(wheels[0])
          PY
          )"
          uv run --no-cache --isolated --no-project \
            --with "$WHEEL_URL" \
            python - "$UPSTREAM_PACKAGE" "$UPSTREAM_VERSION" <<'PY'
          import importlib.metadata
          import sys

          assert importlib.metadata.version(sys.argv[1]) == sys.argv[2]
          PY

      - name: Update dependency and bump dependent version
        if: steps.state.outputs.needed == 'true'
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          UPDATE_MODE: ${{ steps.edge.outputs.update_mode }}
          VERSION_SCHEME: ${{ steps.edge.outputs.version_scheme }}
          UV_NO_CACHE: "1"
        working-directory: downstream
        run: |
          set -Eeuo pipefail
          REQUIRED_INTERNAL=()
          while read -r requirement; do
            REQUIRED_INTERNAL+=("$requirement")
          done < <(uv run --no-cache --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_name = os.environ["UPSTREAM_PACKAGE"]
          graph = tomllib.loads(Path("../coordinator/.github/release-graph.toml").read_text())["packages"]
          package_order = list(graph)
          released_index = package_order.index(package_name)
          released_packages = {
              package["name"]: package
              for package in tomllib.loads(Path("../upstream/uv.lock").read_text())["package"]
          }
          for name in package_order[: released_index + 1]:
              if name not in released_packages:
                  raise SystemExit(f"Release tag lock is missing internal package: {name}")
              package = released_packages[name]
              if name != package_name and "registry" not in package.get("source", {}):
                  raise SystemExit(f"{name} is not locked from a package registry")
              print(f"{name}=={package['version']}")
          PY
          )
          (( ${#REQUIRED_INTERNAL[@]} ))
          if [[ "$UPDATE_MODE" == "exact" ]]; then
            uv add --no-cache --frozen \
              "${UPSTREAM_PACKAGE}==${UPSTREAM_VERSION}"
          elif [[ "$UPDATE_MODE" != "lock" ]]; then
            echo "Unsupported dependency update mode: $UPDATE_MODE" >&2
            exit 1
          fi

          NEXT_VERSION="$(uv run --no-cache --no-project python - "$VERSION_SCHEME" <<'PY'
          import re
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              current = tomllib.load(stream)["project"]["version"]
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(?:rc(\d+))?", current)
          if not match:
              raise SystemExit(f"Unsupported current version: {current}")
          major, minor, patch, rc = match.groups()
          if sys.argv[1] == "patch":
              if rc is not None:
                  raise SystemExit(f"Cannot patch-bump prerelease version: {current}")
              print(f"{major}.{minor}.{int(patch) + 1}")
          elif sys.argv[1] == "rc":
              if rc is None:
                  raise SystemExit(f"Cannot rc-bump stable version: {current}")
              print(f"{major}.{minor}.{patch}rc{int(rc) + 1}")
          else:
              raise SystemExit(f"Unsupported version scheme: {sys.argv[1]}")
          PY
          )"
          ./bin/bump_version.sh "$NEXT_VERSION"

          LOCK_ARGS=(uv lock --no-cache --no-sources)
          for requirement in "${REQUIRED_INTERNAL[@]}"; do
            package="${requirement%%==*}"
            LOCK_ARGS+=(
              --upgrade-package "$requirement"
              --exclude-newer-package "$package=1 second"
            )
          done
          "${LOCK_ARGS[@]}"
          uv run --no-cache --no-project python - "${REQUIRED_INTERNAL[@]}" <<'PY'
          import sys
          import tomllib

          locked = {
              package["name"]: package["version"]
              for package in tomllib.load(open("uv.lock", "rb"))["package"]
          }
          for requirement in sys.argv[1:]:
              name, version = requirement.split("==", 1)
              if locked.get(name) != version:
                  raise SystemExit(f"{name} lock is {locked.get(name)}, not required {version}")
          PY
          "$GIT_BINARY" diff --check

      - name: Push one normal dependent commit
        if: steps.state.outputs.needed == 'true'
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          DOWNSTREAM_BRANCH: ${{ steps.edge.outputs.downstream_branch }}
        working-directory: downstream
        run: |
          set -Eeuo pipefail
          "$GIT_BINARY" config user.name "ArchiveBox Release Bot"
          "$GIT_BINARY" config user.email "release-bot@archivebox.io"
          "$GIT_BINARY" add -u
          "$GIT_BINARY" commit -m "Bump for ${UPSTREAM_PACKAGE} ${UPSTREAM_VERSION}"
          "$GIT_BINARY" push origin "HEAD:${DOWNSTREAM_BRANCH}"

      - name: Dispatch configured release dependents
        if: steps.edge.outputs.dispatch_repositories != ''
        env:
          GH_TOKEN: ${{ secrets.release_token }}
          DISPATCH_REPOSITORIES: ${{ steps.edge.outputs.dispatch_repositories }}
          DISPATCH_EVENT: ${{ steps.edge.outputs.dispatch_event }}
          UPSTREAM_REPOSITORY: ${{ steps.edge.outputs.repository }}
          UPSTREAM_TAG_PREFIX: ${{ steps.edge.outputs.tag_prefix }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          RELEASE_TAG="${UPSTREAM_TAG_PREFIX}${UPSTREAM_VERSION}"
          RELEASE_SHA="$("$GIT_BINARY" -C upstream rev-parse HEAD)"
          REMOTE_SHA="$("$GIT_BINARY" ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" | cut -f1)"
          test "$REMOTE_SHA" = "$RELEASE_SHA"
          test "$("$GH_BINARY" release view "$RELEASE_TAG" --repo "$UPSTREAM_REPOSITORY" --json tagName --jq .tagName)" = "$RELEASE_TAG"

          IFS=',' read -ra repositories <<< "$DISPATCH_REPOSITORIES"
          for repository in "${repositories[@]}"; do
            "$GH_BINARY" api "repos/${repository}/dispatches" \
              --method POST \
              -f event_type="$DISPATCH_EVENT" \
              -F "client_payload[ref]=$RELEASE_TAG" \
              -F "client_payload[sha]=$RELEASE_SHA" \
              -F "client_payload[version]=$UPSTREAM_VERSION"
            echo "Dispatched ${repository} for ${UPSTREAM_REPOSITORY}@${RELEASE_TAG}"
          done
