name: Cascade verified release

on:
  workflow_call:
    inputs:
      upstream_package:
        description: Released Python distribution name
        required: true
        type: string
      upstream_version:
        description: Exact public release version
        required: true
        type: string
      upstream_artifact_name:
        description: Candidate artifact containing the published wheel and sdist
        required: true
        type: string
    secrets:
      release_token:
        description: Token allowed to push the immediate dependent repository
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: cascade-${{ inputs.upstream_package }}
  cancel-in-progress: false

jobs:
  cascade:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release graph
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ArchiveBox/monorepo
          ref: main
          path: coordinator
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Download exact tested release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.upstream_artifact_name }}
          path: ${{ runner.temp }}/public-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve dependency edge
        id: edge
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          uv run --no-cache --no-project python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          package_name = os.environ["UPSTREAM_PACKAGE"]
          version = os.environ["UPSTREAM_VERSION"]
          graph = tomllib.loads(Path("coordinator/.github/release-graph.toml").read_text())["packages"]
          if package_name not in graph:
              raise SystemExit(f"Unknown release package: {package_name}")
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:rc\d+)?", version):
              raise SystemExit(f"Unsupported release version: {version}")
          edge = graph[package_name]
          if edge["repository"].lower() != os.environ["GITHUB_REPOSITORY"].lower():
              raise SystemExit(
                  f"{package_name} releases must originate from {edge['repository']}, "
                  f"not {os.environ['GITHUB_REPOSITORY']}"
              )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as stream:
              for key, value in edge.items():
                  if isinstance(value, list):
                      value = ",".join(value)
                  print(f"{key}={value}", file=stream)
          PY

      - name: Checkout exact released dependency set
        if: steps.edge.outputs.downstream_repository != '' || steps.edge.outputs.dispatch_repositories != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.edge.outputs.repository }}
          ref: ${{ format('{0}{1}', steps.edge.outputs.tag_prefix, inputs.upstream_version) }}
          path: upstream
          persist-credentials: false

      - name: Checkout immediate dependent
        if: steps.edge.outputs.downstream_repository != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.edge.outputs.downstream_repository }}
          ref: ${{ steps.edge.outputs.downstream_branch }}
          path: downstream
          fetch-depth: 0
          token: ${{ secrets.release_token }}

      - name: Check whether release is already consumed
        if: steps.edge.outputs.downstream_repository != ''
        id: state
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        working-directory: downstream
        run: |
          set -Eeuo pipefail
          STATE="$(uv run --no-cache --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_name = os.environ["UPSTREAM_PACKAGE"]
          released_version = os.environ["UPSTREAM_VERSION"]
          graph = tomllib.loads(Path("../coordinator/.github/release-graph.toml").read_text())["packages"]
          package_order = list(graph)
          released_index = package_order.index(package_name)
          released_lock = {
              package["name"]: package["version"]
              for package in tomllib.loads(Path("../upstream/uv.lock").read_text())["package"]
          }
          released_metadata = tomllib.loads(Path("../upstream/pyproject.toml").read_text())["project"]
          downstream_lock = {
              package["name"]: package["version"]
              for package in tomllib.loads(Path("uv.lock").read_text())["package"]
          }
          if released_metadata.get("name") != package_name or released_metadata.get("version") != released_version:
              raise SystemExit(
                  f"Release tag metadata has {released_metadata.get('name')}=={released_metadata.get('version')}, "
                  f"not {package_name}=={released_version}"
              )
          required_names = package_order[:released_index]
          missing = [name for name in required_names if name not in released_lock]
          if missing:
              raise SystemExit(f"Release tag lock is missing internal packages: {', '.join(missing)}")
          required = {name: released_lock[name] for name in required_names}
          required[package_name] = released_version

          if all(downstream_lock.get(name) == version for name, version in required.items()):
              print("consumed")
          else:
              print("needed")
          PY
          )"
          if [[ "$STATE" == "consumed" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${UPSTREAM_PACKAGE} ${UPSTREAM_VERSION} is already consumed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release tools through abxpkg
        if: steps.state.outputs.needed == 'true' || steps.edge.outputs.dispatch_repositories != ''
        env:
          ABXPKG_LIB_DIR: ${{ runner.temp }}/abx-lib
        run: |
          set -Eeuo pipefail
          ABXPKG_VERSION="$(uv run --no-cache --no-project python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          packages = tomllib.loads(Path("upstream/uv.lock").read_text())["package"]
          versions = [package["version"] for package in packages if package["name"] == "abxpkg"]
          if not versions:
              tag = subprocess.check_output(
                  ["git", "-C", "downstream", "describe", "--tags", "--abbrev=0", "--match", "v[0-9]*"],
                  text=True,
              ).strip()
              versions = [tag.removeprefix("v")]
          print(versions[0])
          PY
          )"
          ABXPKG_WHEEL_URL="https://github.com/ArchiveBox/abxpkg/releases/download/v${ABXPKG_VERSION}/abxpkg-${ABXPKG_VERSION}-py3-none-any.whl"
          uv run --no-cache --no-project --with "abxpkg @ $ABXPKG_WHEEL_URL" abxpkg env \
            --install \
            --no-cache \
            --json \
            --lib="$ABXPKG_LIB_DIR" \
            --binproviders=env,apt \
            git gh jq >/dev/null
          for name in git gh jq; do
            binary="$ABXPKG_LIB_DIR/env/bin/$name"
            test -L "$binary"
            test -x "$binary"
          done
          {
            echo "GIT_BINARY=$ABXPKG_LIB_DIR/env/bin/git"
            echo "GH_BINARY=$ABXPKG_LIB_DIR/env/bin/gh"
            echo "JQ_BINARY=$ABXPKG_LIB_DIR/env/bin/jq"
          } >> "$GITHUB_ENV"

      - name: Verify exact public upstream release
        id: public-release
        if: steps.state.outputs.needed == 'true' || steps.edge.outputs.dispatch_repositories != ''
        env:
          UPSTREAM_REPOSITORY: ${{ steps.edge.outputs.repository }}
          UPSTREAM_TAG_PREFIX: ${{ steps.edge.outputs.tag_prefix }}
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          TESTED_ARTIFACT_DIR: ${{ runner.temp }}/public-release
        working-directory: ${{ steps.edge.outputs.downstream_repository != '' && 'downstream' || 'coordinator' }}
        run: |
          set -Eeuo pipefail
          RELEASE_TAG="${UPSTREAM_TAG_PREFIX}${UPSTREAM_VERSION}"
          # Do not require a GitHub Release here. Automated rc builds must not
          # publish GitHub Releases because each one emails subscribed users.
          # The release coordinator keys off the exact git tag plus the exact
          # candidate artifacts that the publisher accepted.
          RELEASE_SHA="$("$GIT_BINARY" -C "$GITHUB_WORKSPACE/upstream" rev-parse HEAD)"
          REMOTE_REF="$("$GIT_BINARY" ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}^{}")"
          if [[ -z "$REMOTE_REF" ]]; then
            REMOTE_REF="$("$GIT_BINARY" ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}")"
          fi
          REMOTE_SHA="${REMOTE_REF%%[[:space:]]*}"
          test "$REMOTE_SHA" = "$RELEASE_SHA"
          mapfile -t PUBLIC_ARTIFACT < <(
            uv run --no-cache --no-project python - "$UPSTREAM_PACKAGE" "$UPSTREAM_VERSION" <<'PY'
          from hashlib import blake2b, sha256
          import json
          import os
          import re
          import sys
          from pathlib import Path

          package, version = sys.argv[1:]
          artifact_dir = Path(os.environ["TESTED_ARTIFACT_DIR"])
          distribution = re.sub(r"[-_.]+", "_", package)
          wheels = list(artifact_dir.rglob(f"{distribution}-{version}-*.whl"))
          sdists = list(artifact_dir.rglob(f"{distribution}-{version}.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one tested wheel and sdist, found {wheels} and {sdists}")

          def artifact(path, packagetype):
              data = path.read_bytes()
              digest = blake2b(data, digest_size=32).hexdigest()
              return {
                  "filename": path.name,
                  "packagetype": packagetype,
                  "url": f"https://files.pythonhosted.org/packages/{digest[:2]}/{digest[2:4]}/{digest[4:]}/{path.name}",
                  "digests": {"sha256": sha256(data).hexdigest()},
                  "size": len(data),
              }

          release = {"info": {"version": version}, "urls": [artifact(sdists[0], "sdist"), artifact(wheels[0], "bdist_wheel")]}
          release_dir = Path(os.environ["RUNNER_TEMP"]) / f"resolved-release-{package}-{version}"
          release_dir.mkdir()
          wheel_path = release_dir / wheels[0].name
          wheel_path.write_bytes(wheels[0].read_bytes())
          (release_dir / "release.json").write_text(json.dumps(release))

          print(release_dir)
          print(wheel_path)
          PY
          )
          test "${#PUBLIC_ARTIFACT[@]}" -eq 2
          WHEEL_DIR="${PUBLIC_ARTIFACT[0]}"
          WHEEL_PATH="${PUBLIC_ARTIFACT[1]}"
          echo "wheel_dir=$WHEEL_DIR" >> "$GITHUB_OUTPUT"
          uv run --no-cache --isolated --no-project \
            --with "$WHEEL_PATH" \
            python - "$UPSTREAM_PACKAGE" "$UPSTREAM_VERSION" <<'PY'
          import importlib.metadata
          import re
          import sys

          package_name, package_version = sys.argv[1:]
          normalized_name = re.sub(r"[-_.]+", "-", package_name).lower()
          distributions = [
              distribution
              for distribution in importlib.metadata.distributions()
              if re.sub(r"[-_.]+", "-", distribution.metadata["Name"]).lower() == normalized_name
          ]
          if len(distributions) != 1:
              raise SystemExit(
                  f"Expected one installed {package_name} distribution, found {len(distributions)}"
              )
          if distributions[0].version != package_version:
              raise SystemExit(
                  f"Installed {package_name} is {distributions[0].version}, not {package_version}"
              )
          PY

      - name: Update the immediate dependency
        if: steps.state.outputs.needed == 'true'
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          UPDATE_MODE: ${{ steps.edge.outputs.update_mode }}
          WHEEL_DIR: ${{ steps.public-release.outputs.wheel_dir }}
          UV_NO_CACHE: "1"
        working-directory: downstream
        run: |
          set -Eeuo pipefail
          REQUIRED_INTERNAL=()
          while read -r requirement; do
            REQUIRED_INTERNAL+=("$requirement")
          done < <(uv run --no-cache --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_name = os.environ["UPSTREAM_PACKAGE"]
          released_version = os.environ["UPSTREAM_VERSION"]
          graph = tomllib.loads(Path("../coordinator/.github/release-graph.toml").read_text())["packages"]
          package_order = list(graph)
          released_index = package_order.index(package_name)
          released_packages = {
              package["name"]: package
              for package in tomllib.loads(Path("../upstream/uv.lock").read_text())["package"]
          }
          for name in package_order[:released_index]:
              if name not in released_packages:
                  raise SystemExit(f"Release tag lock is missing internal package: {name}")
              package = released_packages[name]
              if "registry" not in package.get("source", {}):
                  raise SystemExit(f"{name} is not locked from a package registry")
              print(f"{name}=={package['version']}")
          print(f"{package_name}=={released_version}")
          PY
          )
          (( ${#REQUIRED_INTERNAL[@]} ))
          if [[ "$UPDATE_MODE" == "exact" ]]; then
            uv add --no-cache --frozen \
              "${REQUIRED_INTERNAL[@]}"
          elif [[ "$UPDATE_MODE" != "lock" ]]; then
            echo "Unsupported dependency update mode: $UPDATE_MODE" >&2
            exit 1
          fi

          LOCK_ARGS=(uv lock --no-cache --no-sources --find-links "$WHEEL_DIR")
          for requirement in "${REQUIRED_INTERNAL[@]}"; do
            LOCK_ARGS+=(
              --upgrade-package "$requirement"
            )
          done
          "${LOCK_ARGS[@]}"
          uv run --no-cache --no-project python - "$UPSTREAM_PACKAGE" "$UPSTREAM_VERSION" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          package_name, package_version = sys.argv[1:]
          release = json.loads((Path(os.environ["WHEEL_DIR"]) / "release.json").read_text())
          wheels = [artifact for artifact in release["urls"] if artifact["packagetype"] == "bdist_wheel"]
          sdists = [artifact for artifact in release["urls"] if artifact["packagetype"] == "sdist"]
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist for {package_name}=={package_version}, "
                  f"found {len(wheels)} wheels and {len(sdists)} sdists"
              )

          def artifact_line(artifact):
              return (
                  f'{{ url = "{artifact["url"]}", hash = "sha256:{artifact["digests"]["sha256"]}", '
                  f'size = {artifact["size"]} }}'
              )

          path = Path("uv.lock")
          text = path.read_text()
          package_pattern = re.compile(
              rf'(?ms)^\[\[package\]\]\n'
              rf'name = "{re.escape(package_name)}"\n'
              rf'version = "{re.escape(package_version)}"\n'
              rf'.*?(?=^\[\[package\]\]|\Z)'
          )
          matches = list(package_pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one lock entry for {package_name}=={package_version}, found {len(matches)}"
              )
          match = matches[0]
          package_block = match.group(0)
          package_block, source_count = re.subn(
              r'^source = \{.*\}$',
              'source = { registry = "https://pypi.org/simple" }',
              package_block,
              count=1,
              flags=re.MULTILINE,
          )
          if source_count != 1:
              raise SystemExit(f"Missing source for {package_name}=={package_version}")
          package_block = re.sub(r'^sdist = \{.*\}\n', '', package_block, flags=re.MULTILINE)
          package_block = re.sub(r'^wheels = \[\n(?:    .*\n)*\]\n', '', package_block, flags=re.MULTILINE)
          package_block = package_block.rstrip() + (
              f'\nsdist = {artifact_line(sdists[0])}\n'
              'wheels = [\n'
              f'    {artifact_line(wheels[0])},\n'
              ']\n\n'
          )
          path.write_text(text[:match.start()] + package_block + text[match.end():])
          PY
          uv lock --check --no-cache --no-sources
          uv run --no-cache --no-project python - "${REQUIRED_INTERNAL[@]}" <<'PY'
          import sys
          import tomllib

          locked = {
              package["name"]: package["version"]
              for package in tomllib.load(open("uv.lock", "rb"))["package"]
          }
          for requirement in sys.argv[1:]:
              name, version = requirement.split("==", 1)
              if locked.get(name) != version:
                  raise SystemExit(f"{name} lock is {locked.get(name)}, not required {version}")
          PY
          "$GIT_BINARY" diff --check

      - name: Push one normal dependent commit
        if: steps.state.outputs.needed == 'true'
        env:
          UPSTREAM_PACKAGE: ${{ inputs.upstream_package }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          DOWNSTREAM_BRANCH: ${{ steps.edge.outputs.downstream_branch }}
          UPDATE_MODE: ${{ steps.edge.outputs.update_mode }}
        working-directory: downstream
        run: |
          set -Eeuo pipefail
          "$GIT_BINARY" config user.name "ArchiveBox Release Bot"
          "$GIT_BINARY" config user.email "release-bot@archivebox.io"
          "$GIT_BINARY" add -u
          "$GIT_BINARY" commit -m "Bump for ${UPSTREAM_PACKAGE} ${UPSTREAM_VERSION}"
          if "$GIT_BINARY" push origin "HEAD:${DOWNSTREAM_BRANCH}"; then
            exit 0
          fi

          "$GIT_BINARY" fetch origin "$DOWNSTREAM_BRANCH"
          if uv run --no-cache --no-project python - "$UPSTREAM_PACKAGE" "$UPSTREAM_VERSION" "$UPDATE_MODE" "origin/$DOWNSTREAM_BRANCH" <<'PY'
          import os
          import re
          import subprocess
          import sys
          import tomllib

          package_name, package_version, update_mode, ref = sys.argv[1:]

          def git_show(path: str) -> str:
              return subprocess.check_output([os.environ["GIT_BINARY"], "show", f"{ref}:{path}"], text=True)

          downstream_lock = {
              package["name"]: package["version"]
              for package in tomllib.loads(git_show("uv.lock"))["package"]
          }
          if downstream_lock.get(package_name) != package_version:
              raise SystemExit(
                  f"{ref} lock has {package_name}=={downstream_lock.get(package_name)}, "
                  f"not {package_version}"
              )

          if update_mode == "exact":
              metadata = tomllib.loads(git_show("pyproject.toml"))["project"]
              dependency_pattern = re.compile(
                  rf"^{re.escape(package_name)}=={re.escape(package_version)}(?:[; ].*)?$"
              )
              if not any(dependency_pattern.match(dependency) for dependency in metadata["dependencies"]):
                  raise SystemExit(
                      f"{ref} pyproject.toml does not pin {package_name}=={package_version}"
                  )

          print(f"{ref} already contains {package_name}=={package_version}")
          PY
          then
            exit 0
          fi

          "$GIT_BINARY" rebase "origin/${DOWNSTREAM_BRANCH}"
          "$GIT_BINARY" push origin "HEAD:${DOWNSTREAM_BRANCH}"

      - name: Dispatch and verify configured release dependents
        if: steps.edge.outputs.dispatch_repositories != ''
        env:
          GH_TOKEN: ${{ secrets.release_token }}
          DISPATCH_REPOSITORIES: ${{ steps.edge.outputs.dispatch_repositories }}
          DISPATCH_WORKFLOWS: ${{ steps.edge.outputs.dispatch_workflows }}
          UPSTREAM_REPOSITORY: ${{ steps.edge.outputs.repository }}
          UPSTREAM_TAG_PREFIX: ${{ steps.edge.outputs.tag_prefix }}
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        run: |
          set -Eeuo pipefail
          RELEASE_TAG="${UPSTREAM_TAG_PREFIX}${UPSTREAM_VERSION}"
          # Do not require a GitHub Release here. Automated rc builds must not
          # publish GitHub Releases because each one emails subscribed users.
          # Downstream package workflows only need the exact upstream git tag.
          RELEASE_SHA="$("$GIT_BINARY" -C upstream rev-parse HEAD)"
          REMOTE_REF="$("$GIT_BINARY" ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}^{}")"
          if [[ -z "$REMOTE_REF" ]]; then
            REMOTE_REF="$("$GIT_BINARY" ls-remote "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}")"
          fi
          REMOTE_SHA="${REMOTE_REF%%[[:space:]]*}"
          test "$REMOTE_SHA" = "$RELEASE_SHA"

          IFS=',' read -ra repositories <<< "$DISPATCH_REPOSITORIES"
          IFS=',' read -ra workflows <<< "$DISPATCH_WORKFLOWS"
          test "${#repositories[@]}" -eq "${#workflows[@]}"

          run_ids=()
          for index in "${!repositories[@]}"; do
            repository="${repositories[$index]}"
            workflow="${workflows[$index]}"
            response="$("$GH_BINARY" api "repos/${repository}/actions/workflows/${workflow}/dispatches" \
              --method POST \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -f ref=main \
              -f "inputs[archivebox_version]=$UPSTREAM_VERSION")"
            run_id="$(printf '%s' "$response" | "$JQ_BINARY" -er '.workflow_run_id')"
            run_ids+=("$run_id")
            echo "Dispatched ${repository} run ${run_id} for ${UPSTREAM_REPOSITORY}@${RELEASE_TAG}"
          done

          status=0
          for index in "${!repositories[@]}"; do
            "$GH_BINARY" run watch "${run_ids[$index]}" \
              --repo "${repositories[$index]}" \
              --compact \
              --exit-status \
              --interval 10 || status=1
          done
          exit "$status"
